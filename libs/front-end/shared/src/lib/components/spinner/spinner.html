<span class="inline-flex items-center justify-center">
  <span
    [style.--spinner-width.px]="width()"
    [style.--spinner-height.px]="height()"
    [style.--spinner-color]="color()"
    class="h-[var(--spinner-height)] w-[var(--spinner-width)] animate-spin rounded-full border-2 border-[var(--spinner-color)] border-t-[var(--spinner-color)]/30"
  ></span>
</span>
