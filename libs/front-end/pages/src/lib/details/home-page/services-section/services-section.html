<section class="services-section pt-7.5 pb-7.5 md:pt-8 lg:pt-17.5 lg:pb-12.5">
  <div class="container-ai">
    <div
      class="mx-auto flex max-w-140 flex-col items-center gap-7.5 px-5 lg:max-w-7xl lg:flex-row lg:items-start lg:gap-10 lg:px-0"
    >
      <lib-heading [variant]="'secondary'" [size]="'lg'">{{
        content()?.title
      }}</lib-heading>
      <p class="max-w-140 text-center lg:max-w-145 lg:pt-0.75 lg:text-left">
        {{ content()?.description }}
      </p>
    </div>

    <div
      class="mx-auto mt-10 grid max-w-100 grid-cols-1 gap-8 lg:mt-20 lg:max-w-none lg:grid-cols-2 lg:gap-10"
    >
      @for (
        card of content()?.cards ?? [];
        track card.id;
        let cardIndex = $index
      ) {
        <lib-service-card
          [variant]="getCardVariant(cardIndex)"
          [content]="card"
        ></lib-service-card>
      }
    </div>
  </div>
</section>
