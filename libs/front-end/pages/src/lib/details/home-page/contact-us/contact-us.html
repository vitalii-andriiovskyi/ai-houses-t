<section class="pt-7.5 pb-22.5 lg:pt-17.5 lg:pb-17.5">
  <div class="container-ai">
    <div
      class="mx-auto flex max-w-140 flex-col items-center gap-7.5 text-center lg:mx-0 lg:max-w-none lg:flex-row lg:items-start lg:gap-10 lg:text-left"
    >
      <lib-heading [variant]="'secondary'" [size]="'lg'">
        {{ content().title }}
      </lib-heading>

      <p class="max-w-95 sm:max-w-105 lg:max-w-80 lg:pt-0.75">
        {{ content().description }}
      </p>
    </div>

    <div
      class="bg-tertiary relative mx-auto mt-10 max-w-100 overflow-hidden rounded-[45px] px-7.5 py-10 lg:mt-20 lg:max-w-none lg:p-15 xl:px-25 xl:py-15"
    >
      <img
        src="images/home-page/contact-us/cont.svg"
        alt="Decorative illustration"
        class="pointer-events-none absolute z-0 translate-x-[47%] -translate-y-1/2 max-lg:hidden lg:top-[50%] lg:right-0 lg:h-162 lg:w-173"
      />
      <lib-contact-us-form
        [content]="content().form"
        class="relative"
      ></lib-contact-us-form>
    </div>
  </div>
</section>
