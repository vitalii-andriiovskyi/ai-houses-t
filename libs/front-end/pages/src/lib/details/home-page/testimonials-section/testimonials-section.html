<section class="testimonials-section py-7.5 lg:pt-17.5 lg:pb-17.5">
  <div class="container-ai">
    <div
      class="mx-auto flex max-w-140 flex-col items-center gap-7.5 text-center lg:max-w-7xl lg:flex-row lg:items-start lg:gap-10 lg:text-left"
    >
      <lib-heading [variant]="'secondary'" [size]="'lg'">{{
        content()?.title
      }}</lib-heading>

      <p class="max-w-97.5 lg:max-w-118 lg:pt-0.75">
        {{ content()?.description }}
      </p>
    </div>
    <div
      class="testimonials-carousel-wrap bg-primary mx-auto mt-10 max-w-100 overflow-hidden rounded-[45px] pt-7.5 pb-15 lg:mt-20 lg:max-w-none lg:pt-21 lg:pb-17"
    >
      <owl-carousel-o #testimonialCarousel [options]="carouselOptions">
        @for (
          item of content()?.items?.slice(0, 5);
          track item.id;
          let i = $index
        ) {
          <ng-template carouselSlide [id]="item.id">
            <article
              class="mx-auto flex max-w-82.5 flex-col gap-11 lg:h-full lg:max-w-151.5 lg:gap-12"
            >
              <div
                class="testimonial-bubble bg-primary border-secondary rounded-[45px] border p-7.5 pb-8 lg:flex-grow-2 lg:px-13 lg:py-12"
              >
                <p class="text-primary-foreground">
                  {{ item.quote }}
                </p>
              </div>

              <div class="pl-15.25 lg:pl-18.5">
                <p
                  class="text-secondary text-[18px] leading-[1.1] font-semibold lg:text-[20px] lg:leading-[1.2]"
                >
                  {{ item.author }}
                </p>
                <p class="text-primary-foreground">
                  {{ item.position }}
                </p>
              </div>
            </article>
          </ng-template>
        }
      </owl-carousel-o>
    </div>
  </div>
</section>
