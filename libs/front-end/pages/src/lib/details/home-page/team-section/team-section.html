<section class="team-section pt-7.5 pb-7.5 lg:pt-17.5 lg:pb-11">
  <div class="container-ai">
    <div
      class="mx-auto flex max-w-140 flex-col items-center gap-7.5 text-center lg:max-w-7xl lg:flex-row lg:items-start lg:gap-10 lg:text-left"
    >
      <lib-heading [variant]="'secondary'" [size]="'lg'">{{
        content()?.title
      }}</lib-heading>

      <p class="max-w-97.5 lg:max-w-118 lg:pt-0.75">
        {{ content()?.description }}
      </p>
    </div>

    <div
      class="mx-auto mt-10 grid max-w-100 grid-cols-1 gap-7.5 md:max-w-none lg:mt-20 lg:grid-cols-3 lg:gap-5 xl:gap-9"
    >
      @for (
        employee of content()?.employees;
        track employee.id;
        let i = $index
      ) {
        <lib-employee-card
          [content]="employee"
          [class.max-lg:!hidden]="i > 3"
        ></lib-employee-card>
      }
    </div>

    <div class="mt-10 flex justify-center lg:justify-end">
      <lib-custom-button
        [label]="content()?.button?.text"
        [routerLink]="content()?.button?.url ?? '/'"
        [variantCustom]="'primary'"
        [styleClass]="'min-h-[68px] w-full'"
        class="w-full max-w-100 lg:w-auto lg:max-w-none lg:min-w-67.5"
      ></lib-custom-button>
    </div>
  </div>
</section>
