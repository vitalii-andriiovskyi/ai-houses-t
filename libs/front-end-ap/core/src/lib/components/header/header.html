<header class="shadow-primary-900/10 min-h-(--header-height) shadow-xl">
  <div
    class="mx-auto flex min-h-(--header-height) w-full max-w-[96rem] items-center justify-between px-5 py-4"
  >
    <a
      class="font-primary bg-linear-to-br from-red-500 to-red-800 bg-clip-text text-2xl font-bold text-transparent capitalize md:text-3xl"
      routerLink="/"
    >
      Home
    </a>

    <div>
      @if (user$ | async) {
        <lib-custom-button
          label="Sign Out:)"
          (click)="signOut()"
          variantCustom="secondary"
        ></lib-custom-button>
      }
    </div>
  </div>
</header>
